<div class="product-card">

    <div class="product-image">

        <img
            class="img-producto"
            [src]="producto.imagen"
            [alt]="producto.nombre"
        >

    </div>

    <div class="product-info">

        <h3>
            {{ producto.nombre }}
        </h3>

        <p>
            {{ producto.descripcion }}
        </p>

        <span class="category">
            {{ producto.categoria }}
        </span>

        <div class="fila-precio">

            <span class="precio">
                ${{ producto.precio | number:'1.0-0' }}
            </span>

            <span class="stock">
                Stock: {{ producto.stock }}
            </span>

        </div>

        <button
            class="btn-rojo"
            [disabled]="agregando()"
            (click)="agregarAlCarrito()">

            {{ agregando() ? 'Agregando...' : 'Agregar al carrito' }}

        </button>

        @if (error()) {

            <p class="error-agregar">
                {{ error() }}
                @if (requiereLogin()) {
                    <a routerLink="/login">Iniciar sesión</a>
                }
            </p>

        }

    </div>

</div>
