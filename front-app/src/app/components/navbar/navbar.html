
<nav class="navbar">

    <div class="navbar-container">

        <a class="logo" routerLink="/">
            🍔 Hamburguesas Level Up
        </a>

        <div class="nav-links">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                Inicio
            </a>

            <a routerLink="/productos" routerLinkActive="active">
                Productos
            </a>

            <a routerLink="/mas-vendidos" routerLinkActive="active">
                🏆 Más vendidos
            </a>

            <a routerLink="/carrito" routerLinkActive="active">
                🛒 Carrito
            </a>

            @if (nombreUsuario) {

                <span class="usuario-activo">
                    👤 {{ nombreUsuario }}
                </span>

                <button class="btn-logout" (click)="cerrarSesion()">
                    Cerrar sesión
                </button>

            } @else {

                <a routerLink="/login" routerLinkActive="active">
                    Iniciar sesión
                </a>

            }

        </div>

    </div>

</nav>
