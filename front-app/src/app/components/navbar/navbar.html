<nav class="navbar">

    <div class="navbar-container">

        <a class="logo" routerLink="/">
            🍔 Level <span>Up</span>
        </a>

        <div class="nav-links">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                Inicio
            </a>

            <a routerLink="/productos" routerLinkActive="active">
                Productos
            </a>

            <a routerLink="/mas-vendidos" routerLinkActive="active">
                🏆 Más vendidos
            </a>

            @if (nombreUsuario) {

                <span class="usuario-activo">
                    👤 {{ nombreUsuario }}
                </span>

                <button class="pill btn-logout" (click)="cerrarSesion()">
                    Cerrar sesión
                </button>

                <button class="pill btn-carrito" (click)="panel.abrir()" aria-label="Abrir carrito">
                    🛒 ${{ panel.total() | number:'1.0-0' }}
                    <span class="burbuja">{{ panel.unidades() }}</span>
                </button>

            } @else {

                <a class="pill btn-login" routerLink="/login">
                    Iniciar sesión
                </a>

            }

        </div>

    </div>

</nav>
