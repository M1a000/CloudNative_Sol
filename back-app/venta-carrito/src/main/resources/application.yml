server:
  port: 8082

spring:
  application:
    name: venta-carrito

  # Conexion a la base de datos cloud (RDS u otra). Las credenciales reales se pasan
  # por variables de entorno en EC2; los valores despues de ":" son solo para uso local.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:carrito_db}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000          # si la BD no responde, fallar en 5 s (y reintentar) en vez de 30 s
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    # Los 3 nodos del clúster (docker/rabbitmq-cluster.yml). Si uno cae, el cliente se reconecta a otro.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    publisher-confirm-type: correlated    # el broker confirma (ack/nack) cada mensaje publicado
    publisher-returns: true               # avisa si un mensaje no llego a ninguna cola
    listener:
      simple:
        acknowledge-mode: manual          # cada consumidor hace ACK / NACK explicito
        prefetch: 1                       # fair dispatch: un mensaje a la vez por consumidor
        default-requeue-rejected: false   # un mensaje rechazado nunca vuelve a la cola: va a la DLX
        # Los reintentos NO se hacen con el retry automatico de Spring sino en
        # EjecutorConReintentos, para decidir explicitamente que error se reintenta.

  # ---------------------------------------------------------------------------
  # Cliente Kafka (EP3). Brokers de docker/kafka.yml.
  # ---------------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: venta-carrito
    producer:
      # acks=all + idempotencia: el broker confirma cuando el mensaje esta en todas las
      # replicas sincronizadas (min.insync.replicas=2) y los reintentos no generan duplicados.
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10                       # agrupa envios cercanos en un solo batch
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000                  # si Kafka no responde, no bloquear la peticion HTTP mas de 5 s
        spring.json.add.type.headers: false # sin __TypeId__: cada consumidor define su propio DTO
    consumer:
      group-id: carrito-sync-inventario
      auto-offset-reset: earliest           # un grupo nuevo procesa desde el inicio de la retencion
      enable-auto-commit: false             # el offset lo confirma el contenedor tras procesar (ack-mode record)
      max-poll-records: 50
      # ErrorHandlingDeserializer: un JSON roto no rompe el listener, se envia al DLT
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.pedidos360.carrito.dto.kafka
        isolation.level: read_committed
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
        # Rebalanceo incremental: al entrar o salir un consumidor solo se mueven las particiones necesarias
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: record                      # confirma el offset de cada mensaje procesado con exito
      missing-topics-fatal: false
    admin:
      properties:
        request.timeout.ms: 10000

# Datos de la App Registration en Azure AD (IDaaS)
azure:
  ad:
    tenant-id: ${AZURE_TENANT_ID:a70c6bf7-a13d-4110-9625-747412057e28}
    client-id: ${AZURE_CLIENT_ID:69ceeda7-0b2f-441c-9c63-f537ab6db86f}

# URL del microservicio de catalogo, por si venta-carrito necesita consultar
# datos de un producto (nombre, precio) al agregarlo al carrito.
catalogo:
  service:
    url: ${CATALOGO_URL:http://localhost:8081}

pedidos360:
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:4200,http://52.200.216.83:4200}

  # ---------------------------------------------------------------------------
  # Topologia RabbitMQ: UNICO lugar donde se definen nombres de exchanges,
  # routing keys y colas. El codigo los lee desde RabbitMQProperties.
  # ---------------------------------------------------------------------------
  rabbitmq:
    exchanges:
      pedidos: pedidos.exchange          # direct: eventos del ciclo de vida de un pedido
      dead-letter: pedidos.dlx           # direct: recibe los mensajes fallidos/expirados
    routing-keys:
      pedido-creado: pedido.creado
    colas:
      ticket:                            # caso de uso: generar el ticket/comprobante del pedido
        nombre: pedidos.ticket.queue
        dlq: pedidos.ticket.dlq
        dlq-routing-key: pedidos.ticket.dead
    retencion:
      ttl-mensaje-ms: 60000              # un pedido no consumido en 60 s se va a la DLQ (motivo "expired")
      max-mensajes: 1000                 # si la cola supera 1000 mensajes, los mas antiguos van a la DLQ
      ttl-dlq-ms: 86400000               # los mensajes en la DLQ se conservan 24 h para analisis
    reintentos:
      max-intentos: 3
      intervalo-inicial-ms: 1000
      multiplicador: 2.0
    dlq:
      # true: DlqAuditoriaConsumer registra en el log cada mensaje muerto y lo retira de la DLQ.
      # false: los mensajes quedan acumulados en la DLQ (util para mostrarlos en el dashboard).
      auditor-activo: ${DLQ_AUDITOR_ACTIVO:true}

  # ---------------------------------------------------------------------------
  # Topologia Kafka (EP3): UNICO lugar donde se definen nombres de topicos,
  # grupos y parametros. El codigo los lee desde KafkaTopicosProperties.
  # Justificacion de cada valor: docs/kafka/casos-de-uso-kafka.md
  # ---------------------------------------------------------------------------
  kafka:
    topicos:
      # Topico que ESTE servicio produce: se declara con su configuracion completa.
      ventas-confirmadas:
        nombre: pedidos360.ventas.confirmadas
        particiones: 3
        replicas: ${KAFKA_REPLICAS:3}
        configuraciones:
          "[cleanup.policy]": delete           # hechos historicos: se borran por antiguedad
          "[retention.ms]": "604800000"        # 7 dias para reprocesar / auditar
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:2}
      # Topico que ESTE servicio consume: solo se necesita el nombre (lo declara productos-catalogo).
      inventario-actualizado:
        nombre: pedidos360.inventario.actualizado
    dlt:
      sufijo: .DLT
      particiones: 1
      replicas: ${KAFKA_REPLICAS:3}
      configuraciones:
        "[cleanup.policy]": delete
        "[retention.ms]": "1209600000"         # 14 dias para analizar los mensajes fallidos
        "[min.insync.replicas]": ${KAFKA_MIN_ISR:2}
    consumidores:
      sync-inventario:
        grupo: carrito-sync-inventario
        concurrencia: 3                        # un hilo por particion del topico de inventario
    reintentos:
      max-intentos: 3                          # solo errores recuperables (BD caida)
      intervalo-inicial-ms: 1000               # 1 s, 2 s, 4 s
      multiplicador: 2.0
      intervalo-maximo-ms: 8000
