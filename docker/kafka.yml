# =============================================================================
# Arquitectura Kafka: 1 Zookeeper + 3 brokers (desarrollo local)
#
#   docker compose -f docker/kafka.yml up -d      (solo Kafka)
#   docker compose up -d                          (todo, desde la raíz)
#
# Cada broker tiene dos listeners:
#   INTERNO  kafkaN:29092     -> tráfico entre brokers y contenedores (Kafka-UI, kafka-init)
#   EXTERNO  localhost:909X   -> microservicios ejecutados en el PC (IntelliJ / mvn spring-boot:run)
#
#   Broker   bootstrap (PC)     JMX (métricas para Kafka-UI)
#   kafka1   localhost:9092     kafka1:9997
#   kafka2   localhost:9093     kafka2:9997
#   kafka3   localhost:9094     kafka3:9997
#
# Valores por defecto del clúster (pensados para 3 brokers):
#   - replication factor 3 y min.insync.replicas 2: con acks=all se tolera la caída de 1 broker.
#   - auto.create.topics = false: los tópicos solo se crean de forma explícita
#     (script kafka/crear-topicos.sh, microservicio kafka-admin o NewTopic en los microservicios).
# =============================================================================
x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 20s

x-kafka-entorno-comun: &kafka-entorno-comun
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  # Tópicos internos (__consumer_offsets, transacciones) replicados en los 3 brokers
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Valores por defecto para tópicos nuevos
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  # Para que la compactación sea visible en la demo (revisa cada 15 s)
  KAFKA_LOG_CLEANER_BACKOFF_MS: 15000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_JMX_PORT: 9997
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka1:
    <<: *kafka-broker
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-entorno-comun
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka1:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9092
      KAFKA_JMX_HOSTNAME: kafka1
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-broker
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-entorno-comun
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka2:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9093
      KAFKA_JMX_HOSTNAME: kafka2
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-broker
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-entorno-comun
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka3:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9094
      KAFKA_JMX_HOSTNAME: kafka3
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # Contenedor de un solo uso: crea los tópicos del proyecto con su configuración
  # (particiones, réplicas, retención, cleanup policy) y termina. Es idempotente.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka1:29092,kafka2:29092,kafka3:29092
    volumes:
      - ./kafka/crear-topicos.sh:/scripts/crear-topicos.sh:ro
    entrypoint: ["bash", "/scripts/crear-topicos.sh"]

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
