# Configuración común de los 3 nodos del clúster RabbitMQ (montada en /etc/rabbitmq/rabbitmq.conf)

# --- Formación del clúster: cada nodo conoce la lista completa de miembros ---
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3

# Si se pierde la comunicación entre nodos, la minoría se pausa en vez de
# seguir aceptando mensajes por su cuenta (evita "split brain").
cluster_partition_handling = pause_minority

# --- Usuario de los microservicios y del dashboard ---
default_user = admin
default_pass = admin123
default_user_tags.administrator = true
loopback_users.guest = false

# Las colas nuevas se crean en el nodo con menos colas (reparte la carga del clúster)
queue_leader_locator = balanced

management.tcp.port = 15672
